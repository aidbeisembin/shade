name: "Shade check"

# Проверки интерфейса Shade на каждый PR в рабочую ветку.
# Что и почему: CLAUDE.md, раздел «Готово значит».

on:
  pull_request:
    branches: [shade]

concurrency:
  group: shade-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: tsc, contrast, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # pnpm test = bun test src/shade
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Contrast (pnpm check:contrast)
        run: pnpm check:contrast

      # кириллица только в strings.ts, локали только в lib/lang.ts (docs/ui/foundations.md, «Язык»)
      - name: Language guard (pnpm check:i18n)
        run: pnpm check:i18n

      - name: Tests (pnpm test)
        run: pnpm test

      - name: Build (pnpm build)
        run: pnpm build

  migrate:
    name: migrate-from-aid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Перенос данных со старых имён: случаи из таблицы PR на подставном HOME.
      - name: Migration script (bash scripts/test-migrate-from-aid.sh)
        run: bash scripts/test-migrate-from-aid.sh

      # Смена identifier 17.11.2026: io.github.katanana23.shade -> com.aidbeisembin.shade.
      - name: Identifier migration (bash scripts/test-migrate-identifier.sh)
        run: bash scripts/test-migrate-identifier.sh

  core:
    name: core (macOS, ffmpeg, Parakeet)
    # Ядро собирается на macOS: build.rs скачивает закреплённый ffmpeg, сверяет SHA-256 архива
    # и бинарника и запускает ffmpeg -version; затем тесты загрузки модели Parakeet (источник,
    # суммы, повреждённый файл, недоступный источник, уже скачанная модель). Репозиторий
    # публичный, раннер macOS бесплатный. Решение: docs/case/decisions.md, 2026-11-17.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # tauri::generate_context! встраивает папку интерфейса, а tauri-build проверяет externalBin.
      # Интерфейс собирает задача frontend, помощник llama здесь не нужен: заглушки.
      - name: Stubs for frontendDist and llama-helper
        run: |
          mkdir -p frontend/out frontend/src-tauri/binaries
          echo '<!doctype html><title>stub</title>' > frontend/out/index.html
          stub=frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          printf '#!/bin/sh\nexit 0\n' > "$stub" && chmod +x "$stub"

      - name: Core build and Parakeet tests (cargo test -p shade --lib parakeet_engine)
        env:
          CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: 'TRUE'
        run: cargo test -p shade --lib parakeet_engine

      - name: Pinned ffmpeg is the one in the build
        working-directory: frontend/src-tauri
        run: |
          bin=binaries/ffmpeg-aarch64-apple-darwin
          expected=$(grep -A3 'macos/arm64/' build/ffmpeg.rs | sed -n 's/.*binary_sha256: "\([0-9a-f]*\)".*/\1/p')
          actual=$(shasum -a 256 "$bin" | cut -d' ' -f1)
          echo "expected $expected"; echo "actual   $actual"
          test -n "$expected" && test "$expected" = "$actual"
          "./$bin" -hide_banner -version | head -1

  release:
    name: release scripts, signature, install.sh
    # Скрипты релиза и установки (таблица случаев PR открытой беты): версия и тег, секреты подписи,
    # latest.json, подпись обновления (minisign), требование подписи без cdhash (codesign нужен macOS),
    # install.sh под /bin/bash 3.2, как у curl | bash. Сам релиз: release.yml.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: minisign
        run: brew install minisign

      - name: Release scripts (bash scripts/release/test-release.sh)
        env:
          SHADE_REQUIRE_MINISIGN: '1'
        run: bash scripts/release/test-release.sh

      - name: Signature check (bash scripts/release/test-check-signature.sh)
        run: bash scripts/release/test-check-signature.sh

      - name: Installer (bash scripts/test-install.sh)
        run: bash scripts/test-install.sh

  brand:
    name: check-brand
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Чужие имена только в THIRD_PARTY_NOTICES.md и явных исключениях (scripts/check-brand.sh).
      - name: Guard test (bash scripts/test-check-brand.sh)
        run: bash scripts/test-check-brand.sh

      - name: Brand guard (bash scripts/check-brand.sh)
        run: bash scripts/check-brand.sh
